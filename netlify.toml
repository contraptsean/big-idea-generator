# Netlify configuration for Opportunity Radar dashboard
# The frontend is static (no build step required).

[build]
  publish = "frontend/"

# Proxy /api/* requests to your backend server.
# Replace https://api.example.com with your actual backend URL
# (e.g. a Railway, Render, or Fly.io deployment of the FastAPI app).
[[redirects]]
  from = "/api/*"
  to = "big-idea-generator-production.up.railway.app"
  status = 200
  force = true
